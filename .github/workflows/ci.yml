name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }

jobs:
  core:
    name: e1_core (lint + pytest, sim + zenoh + mocap)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: e1_core/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libosmesa6
      - run: pip install -r e1_core/requirements.txt pytest flake8
      - run: flake8 --max-line-length 140 --extend-ignore E731,E702,E741,W503,E226 e1_core e1_bridge e1_control e1_bringup e1_mocap examples tools
      - run: cd e1_core && E1_DESCRIPTION_DIR=$GITHUB_WORKSPACE/e1_description MUJOCO_GL=egl python -m pytest -q
      - name: viewer data is reproducible
        run: |
          pip install -e e1_core
          E1_DESCRIPTION_DIR=$GITHUB_WORKSPACE/e1_description python tools/web_trajectories.py --out /tmp/viewer
          python - <<'PY'
          import json
          for n in ('mujoco_swarm6', 'mujoco_square', 'mujoco_yaw_align'):
              d = json.load(open(f'/tmp/viewer/{n}.json'))
              assert d['frames'] and len(d['frames'][0]) == 11 * len(d['ids']), n
          print('ok')
          PY

  ros:
    name: colcon (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: { distro: [jazzy, kilted] }
    container: ros:${{ matrix.distro }}-ros-base
    steps:
      - uses: actions/checkout@v4
        with: { path: src/e1_nano_ros }
      - name: deps
        run: |
          apt-get update
          apt-get install -y python3-pip ros-${{ matrix.distro }}-rmw-zenoh-cpp ros-${{ matrix.distro }}-robot-state-publisher \
            ros-${{ matrix.distro }}-tf2-ros ros-${{ matrix.distro }}-rviz2 libegl1
          pip3 install --break-system-packages -r src/e1_nano_ros/e1_core/requirements.txt
      - name: build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_direct+
          source install/setup.bash
          ros2 interface show e1_msgs/msg/FlightState
          python3 -c "import e1_bridge.bridge_node, e1_control.swarm_controller, e1_control.missions, e1_mocap.natnet_node"
      - name: smoke test (sim + bridge + controller)
        shell: bash
        run: |
          source install/setup.bash
          export RMW_IMPLEMENTATION=rmw_zenoh_cpp MUJOCO_GL=egl
          ros2 run rmw_zenoh_cpp rmw_zenohd & sleep 2
          ros2 run e1_core e1-sim -n 2 --duration 40 & sleep 3
          ros2 run e1_bridge e1_bridge & ros2 run e1_control swarm_controller & sleep 6
          ros2 topic echo --once /e1_1/state
          ros2 service call /e1/takeoff_all e1_msgs/srv/Takeoff "{height: 0.4, duration: 2.0}"
          sleep 5
          python3 src/e1_nano_ros/.github/check_altitude.py 1 2
          kill %2 %3 %4 || true
      - name: smoke test (fake OptiTrack -> e1_mocap -> bridge, 60 deg heading error)
        shell: bash
        run: |
          source install/setup.bash
          export RMW_IMPLEMENTATION=rmw_zenoh_cpp MUJOCO_GL=egl
          ros2 run e1_core e1-sim -n 2 --duration 40 --natnet 127.0.0.1 --natnet-up y --yaw-offset 60 --yaw-drift 1 & sleep 3
          ros2 run e1_mocap natnet --ros-args -p server_ip:=127.0.0.1 -p local_ip:=127.0.0.1 -p multicast:=false -p up_axis:=y & sleep 3
          ros2 run e1_bridge e1_bridge --ros-args -p "mocap_topic:=/e1_{id}/mocap/pose" -p "ids:=[1,2]" &
          ros2 run e1_control swarm_controller --ros-args -p "ids:=[1,2]" & sleep 6
          ros2 topic echo --once /e1/mocap/status
          ros2 service call /e1/takeoff_all e1_msgs/srv/Takeoff "{height: 0.4, duration: 2.0}"
          sleep 5
          python3 src/e1_nano_ros/.github/check_altitude.py 1 2

  firmware:
    name: firmware (${{ matrix.env }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: { env: [e1_nano, e1_nano_stock, e1_mini, e1_mini_stock] }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with: { path: ~/.platformio, key: 'pio-${{ hashFiles(''firmware/platformio.ini'') }}' }
      - run: pip install platformio esptool && sudo apt-get install -y cmake
      - if: matrix.env == 'e1_nano'
        run: firmware/test/host_check/run.sh 1.10.1
      - run: cd firmware && pio run -e ${{ matrix.env }}
      - run: firmware/tools/merge_bin.sh ${{ matrix.env }} dist
      - uses: actions/upload-artifact@v4
        with: { name: 'firmware-${{ matrix.env }}', path: dist/* }
