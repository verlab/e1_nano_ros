site_name: E1 Nano ROS — ESP32 mini-drone swarm
site_description: ROS 2 driver, Zenoh firmware, MuJoCo/Genesis simulation and tutorials for the Cherglow E1 Nano
site_url: https://verlab.github.io/e1_nano_ros/
repo_url: https://github.com/verlab/e1_nano_ros
repo_name: verlab/e1_nano_ros
edit_uri: edit/main/docs/
copyright: VeRLab — DCC/UFMG · code Apache-2.0 · model/firmware under their original licenses
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep orange
      accent: amber
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle: { icon: material/weather-sunny, name: Light mode }
  features: [navigation.tabs, navigation.sections, navigation.top, content.code.copy, content.tabs.link, search.highlight]
  icon: { repo: fontawesome/brands/github }
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.superfences:
      custom_fences:
        - { name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format }
nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Simulation in 5 minutes: tutorial/01-simulation.md
  - Tutorial:
      - 1. Simulation (without ROS): tutorial/01-simulation.md
      - 2. ROS 2 + RViz: tutorial/02-ros2.md
      - 3. Firmware and first flight: tutorial/03-firmware.md
      - 4. Real flight with motion capture: tutorial/04-real-flight.md
      - 5. Swarm: tutorial/05-swarm.md
      - 6. Genesis and reinforcement learning: tutorial/06-genesis.md
      - 7. Writing your own controller: tutorial/07-controller.md
  - 3D viewer: viewer/index.html
  - Reference:
      - Architecture: architecture.md
      - Middleware choice: middleware.md
      - Zenoh protocol: protocol.md
      - ROS 2 API: ros-api.md
      - Motion capture (OptiTrack): mocap.md
      - Hardware and 3D model: hardware.md
      - Simulation: simulation.md
      - Firmware: firmware.md
      - Flight safety: safety.md
  - FAQ: faq.md
  - Contributing: contributing.md
