; E1 Nano firmware = CF-Drone (git submodule, unmodified) + E1 Zenoh link (src_e1/)
; Build:   pio run -e e1_nano            Flash:  pio run -e e1_nano -t upload       Monitor: pio device monitor
; Sources are assembled into .e1_src/ by tools/prepare_src.py before every build.

[platformio]
src_dir = .e1_src
default_envs = e1_nano

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/prepare_src.py
lib_deps =
    https://github.com/eclipse-zenoh/zenoh-pico.git#1.10.1      ; must match the router (rmw_zenoh: zenoh 1.10.x)
    https://github.com/okalachev/mavlink-arduino.git#2.0.35      ; required by CF-Drone
build_flags =
    -DE1_ZENOH_DEFAULT_LOCATOR=\"tcp/192.168.1.100:7447\"     ; default router, change with: zn connect tcp/<ip>:7447
    -DE1_ZENOH_DEFAULT_ON=1
    -DZ_FEATURE_LIVELINESS=1
    -DZ_FEATURE_MULTI_THREAD=1
    -DZ_FEATURE_LINK_UDP_MULTICAST=0
    -DZ_FEATURE_SCOUTING=0
    -DFRAG_MAX_SIZE=2048
    -DBATCH_UNICAST_SIZE=1024

; ESP32-S3 SuperMini (ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM, native USB) - E1 Nano v1.5Y
[env:e1_nano]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; Same firmware for the larger Cherglow E1 MINI (classic ESP32 dev board)
[env:e1_mini]
board = esp32dev
